<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <title>DriveBy</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        :root {
            --blue: #2563eb;
            --blue-soft: rgba(37, 99, 235, 0.12);
            --text: #111827;
            --muted: #6b7280;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: var(--font);
            color: var(--text);
        }

        #map {
            height: 100%;
            width: 100%;
        }

        button {
            font: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        /* ---------- top: agent type ---------- */
        .kind {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: #fff;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-btn img {
            width: 30px;
            height: 30px;
        }

        .kind-menu {
            display: flex;
            gap: 10px;
            padding: 8px;
            background: #fff;
            border-radius: 32px;
            box-shadow: var(--shadow);
        }

        .kind-menu[hidden] {
            display: none;
        }

        .kind-menu .icon-btn {
            box-shadow: none;
            background: #f3f4f6;
        }

        .kind-menu .icon-btn.selected {
            background: var(--blue-soft);
            border-color: var(--blue);
        }

        /* ---------- bottom: panel ---------- */
        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            background: #fff;
            border-radius: 16px 16px 0 0;
            box-shadow: var(--shadow);
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 520px;
            margin: 0 auto;
        }

        #msg {
            font-size: 15px;
            line-height: 1.35;
            white-space: pre-wrap;
            min-height: 20px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            flex: 1;
            height: 46px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            background: #f3f4f6;
            color: var(--text);
        }

        .actions button.primary {
            background: var(--blue);
            color: #fff;
        }

        .actions button.ghost {
            flex: 0 0 auto;
            padding: 0 16px;
            background: transparent;
            color: var(--muted);
        }

        /* ---------- navigation ---------- */
        .nav-btn {
            position: fixed;
            right: 16px;
            bottom: 150px;
            z-index: 1000;
            height: 44px;
            padding: 0 16px;
            border: none;
            border-radius: 22px;
            background: #fff;
            color: var(--blue);
            font-weight: 600;
            box-shadow: var(--shadow);
        }

        #zoom-msg {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.8);
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        #zoom-msg:empty {
            display: none;
        }
    </style>
</head>
<body>
<div id="map"></div>

<!-- top: which agent you create (tap to switch) -->
<div class="kind">
    <button id="kind-btn" class="icon-btn" aria-label="Agent type">
        <img id="kind-icon" src="icons/walker.png" alt=""/>
    </button>
    <div id="kind-menu" class="kind-menu" hidden>
        <button id="kind-walker" class="icon-btn" aria-label="Walker">
            <img src="icons/walker.png" alt=""/>
        </button>
        <button id="kind-driver" class="icon-btn" aria-label="Driver">
            <img src="icons/car.png" alt=""/>
        </button>
    </div>
</div>

<button id="btn-follow" class="nav-btn" hidden>Navigate</button>
<button id="btn-stop-follow" class="nav-btn" hidden>Stop</button>

<!-- bottom: start / destination / create -->
<div class="sheet">
    <div id="msg"></div>
    <div class="actions">
        <button id="btn-confirm" disabled>Confirm</button>
        <button id="btn-create" class="primary" disabled>Create</button>
        <button id="btn-cancel" class="ghost">Close</button>
    </div>
</div>

<div id="zoom-msg"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script src="status.js"></script>
<script src="socket.js"></script>
<script src="geo.js"></script>
<script src="match_layers.js"></script>
<script src="navigation.js"></script>
<script src="create_flow.js"></script>
<script src="create.js"></script>
</body>
</html>
